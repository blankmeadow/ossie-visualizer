# Nginx Configuration for Ossie Visualizer Internal Deployment
server {
    listen       80;
    server_name  localhost; # Replace with your internal server IP or domain

    root   /usr/share/nginx/html/ossie-visualizer;
    index  index.html;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable Gzip compression
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Cache static JS/CSS/image assets
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
